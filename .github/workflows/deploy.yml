name: Build, test and deploy

# Every push builds the static export and runs the tests. Every change on main
# (a merge, or "Run workflow" from the Actions tab) then waits for a person to
# approve the deploy: the production environment has a required reviewer and
# only accepts main. Modelled on AnamataHQ/anamata-ai-website's deploy workflow.
#
# A push to any other branch lands on the preview site instead,
# dev.anna-site.anamata.ai, automatically and behind a shared password. The
# preview has its own server user and key that can write only the preview
# folder; the production key never leaves the deploy job. Only collaborators
# can push here, and a fork pull request runs without secrets, so nobody else
# can reach either key (there is deliberately no pull_request trigger).

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'anna-site-deploy' || format('build-{0}', github.ref) }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_HOST: 136.144.164.80 # vps-RGF
  DEPLOY_USER: anna-site-deploy
  DEPLOY_PATH: /var/www/anna-site
  # The preview user's key is restricted with rrsync to /var/www/anna-site-dev.
  PREVIEW_USER: anna-site-preview

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Public site key of the Turnstile widget (repo variable, not a secret).
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      - run: npm test
      # Hidden files (dist/client/.vite build metadata) are left out by default.
      - uses: actions/upload-artifact@v4
        with:
          name: anna-site-export
          path: dist/client/
          retention-days: 7

  deploy:
    name: Deploy to anna-site.anamata.ai (human-approved)
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://anna-site.anamata.ai
    steps:
      # Deploy the exact files the test job built and checked.
      - uses: actions/download-artifact@v4
        with:
          name: anna-site-export
          path: export/

      - name: Deploy over rsync
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # vps-RGF's own host key line, pinned as a repo variable (public data).
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -f export/index.html
          test -n "$DEPLOY_KNOWN_HOSTS"
          # Cloudflare's test site key in a production build would make the
          # lead service drop every real request as spam.
          if grep -rq '1x00000000000000000000AA' export/; then
            echo "Build uses the Turnstile test key; set the TURNSTILE_SITE_KEY repo variable." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -rltz --delete --chmod=D755,F644 --exclude '.vite/' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            export/ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

  preview:
    name: Preview on dev.anna-site.anamata.ai
    needs: test
    if: github.ref_type == 'branch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    # No required reviewer on this environment: the preview is automatic. It
    # gives the pull request a "deployed" link to the preview.
    environment:
      name: preview
      url: https://dev.anna-site.anamata.ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Built again without the site key: the production Turnstile key is
      # bound to anna-site.anamata.ai and would only show an error on the
      # preview hostname. The test key renders everywhere, and the preview
      # form cannot reach the lead service anyway (deploy/Caddyfile.anna-site-dev).
      - run: npm run build

      - name: Upload to the preview folder
        env:
          PREVIEW_SSH_KEY: ${{ secrets.PREVIEW_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -f dist/client/index.html
          test -n "$DEPLOY_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$PREVIEW_SSH_KEY" > ~/.ssh/preview_key
          chmod 600 ~/.ssh/preview_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The server restricts this key with rrsync to /var/www/anna-site-dev,
          # so "/" here is that folder and nothing else is reachable.
          rsync -rltz --delete --chmod=D755,F644 --exclude '.vite/' \
            -e "ssh -i ~/.ssh/preview_key -o StrictHostKeyChecking=yes" \
            dist/client/ "${PREVIEW_USER}@${DEPLOY_HOST}:/"

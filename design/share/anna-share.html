<!doctype html>
<!--
  Share card for links to anna-site.anamata.ai (Open Graph and Twitter).
  Render at exactly 1200x630 to public/share/anna-1200x630.png; see README.md.
  Colours are the site tokens from app/globals.css: --navy #08152e,
  --paper #f5f2eb, --paper-light #fbfaf6, --blue #2f63ff, --ink #0b1630.
  The calendar is an abstraction on purpose: blocks only, no words, so the
  card reads the same in every language and at thumbnail size.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Anna share card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@500;650&display=block"
      rel="stylesheet"
    />
    <style>
      :root {
        --navy: #08152e;
        --navy-raised: #10203f;
        --paper: #f5f2eb;
        --paper-light: #fbfaf6;
        --blue: #2f63ff;
        --ink: #0b1630;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--navy);
      }
      body {
        font-family: 'Geist', Arial, Helvetica, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        position: relative;
        display: grid;
        grid-template-columns: 1fr 460px;
        align-items: center;
        gap: 72px;
        width: 1200px;
        height: 630px;
        padding: 0 96px;
        background: var(--navy);
      }

      /* Left: the mark on a paper disc, the wordmark, the byline. */
      .identity {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }
      .disc {
        display: grid;
        place-items: center;
        width: 148px;
        height: 148px;
        border-radius: 50%;
        background: var(--paper);
        box-shadow:
          0 18px 40px rgba(0, 0, 0, 0.32),
          0 0 0 10px rgba(255, 255, 255, 0.04);
      }
      .disc svg {
        width: 104px;
        height: 104px;
      }
      .wordmark {
        margin: 40px 0 0;
        color: white;
        font-size: 128px;
        font-weight: 650;
        line-height: 0.95;
        letter-spacing: -0.045em;
      }
      .byline {
        margin: 18px 0 0 6px;
        color: #b4c0d6;
        font-size: 30px;
        font-weight: 500;
        letter-spacing: -0.01em;
      }

      /* Right: a paper day with blue blocks, no labels. */
      .day {
        overflow: hidden;
        width: 460px;
        height: 470px;
        border: 1px solid rgba(255, 255, 255, 0.26);
        border-radius: 26px;
        background: #fbfaf7;
        box-shadow:
          0 36px 80px rgba(0, 0, 0, 0.34),
          0 0 0 12px rgba(255, 255, 255, 0.035);
      }
      .day-top {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 64px;
        padding: 0 24px;
        border-bottom: 1px solid #dfe2e8;
        background: white;
      }
      .day-top i {
        display: block;
        height: 10px;
        border-radius: 5px;
        background: #dfe3ea;
      }
      .day-top i:first-child {
        width: 120px;
        background: #cfd5e0;
      }
      .day-top i:nth-child(2) {
        width: 46px;
        margin-left: auto;
      }
      .day-top i:nth-child(3) {
        width: 46px;
      }
      .day-body {
        display: grid;
        grid-template-columns: 52px 1fr;
        height: 405px;
        padding: 14px 22px 18px 0;
      }
      .rail {
        display: grid;
        grid-template-rows: repeat(8, 1fr);
      }
      .rail i {
        display: block;
        justify-self: end;
        width: 16px;
        height: 4px;
        margin: 0 12px 0 0;
        border-radius: 2px;
        background: #d6dae2;
        transform: translateY(-2px);
      }
      .grid {
        position: relative;
        border-left: 1px solid #dfe2e8;
        background: repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent calc(12.5% - 1px),
          #e4e6eb calc(12.5% - 1px),
          #e4e6eb 12.5%
        );
      }
      .block {
        position: absolute;
        right: 4%;
        left: 4%;
        border: 1px solid rgba(47, 99, 255, 0.17);
        border-left: 4px solid var(--blue);
        border-radius: 7px;
        background: #eaf0ff;
        box-shadow: 0 4px 12px rgba(11, 22, 48, 0.06);
      }
      /* One long stretch of time that is yours again. */
      .block.focus {
        border-color: rgba(47, 99, 255, 0.3);
        border-left-color: var(--blue);
        background: var(--blue);
      }
      .block.done {
        border-left-color: #9fb5ff;
        background: #f1f5ff;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <section class="identity">
        <div class="disc">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 200 200"
            aria-hidden="true"
          >
            <defs>
              <linearGradient
                id="relay-gradient"
                x1="42"
                y1="42"
                x2="158"
                y2="158"
                gradientUnits="userSpaceOnUse"
              >
                <stop offset="0" stop-color="#2C548C" />
                <stop offset="0.43" stop-color="#3159C7" />
                <stop offset="0.49" stop-color="#6252EF" />
                <stop offset="0.55" stop-color="#8D4DFF" />
                <stop offset="0.61" stop-color="#E15091" />
                <stop offset="1" stop-color="#FF5C42" />
              </linearGradient>
            </defs>
            <!-- Same path as public/brands/anna-color-transparent.svg. -->
            <path
              fill="url(#relay-gradient)"
              d="M42 158V62H66V98L100 128V158L66 128V158H42ZM158 42V138H134V102L100 72V42L134 72V42H158ZM42 42H65L83 57V80L60 62H42V42ZM158 158H135L117 143V120L140 138H158V158Z"
            />
          </svg>
        </div>
        <p class="wordmark">Anna</p>
        <p class="byline">by Anamata</p>
      </section>

      <section class="day" aria-hidden="true">
        <div class="day-top"><i></i><i></i><i></i></div>
        <div class="day-body">
          <div class="rail">
            <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
          </div>
          <div class="grid">
            <span class="block done" style="top: 2%; height: 9%"></span>
            <span class="block focus" style="top: 14%; height: 46%"></span>
            <span class="block done" style="top: 63%; height: 8%"></span>
            <span class="block" style="top: 75%; height: 10%"></span>
            <span class="block done" style="top: 88%; height: 9%"></span>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Anna identity concept 02: Palindrome</title>
  <desc id="desc">A bilaterally balanced pair of open loops based on Anna being a palindrome, shown as a primary lockup, avatar, monochrome mark, and mirroring principle.</desc>
  <defs>
    <linearGradient id="palLeft" x1="20" y1="122" x2="82" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2C548C"/>
      <stop offset="1" stop-color="#5968E8"/>
    </linearGradient>
    <linearGradient id="palRight" x1="78" y1="122" x2="140" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8D4DFF"/>
      <stop offset="1" stop-color="#FF5C42"/>
    </linearGradient>
    <linearGradient id="palFull" x1="0" y1="0" x2="1600" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2C548C"/>
      <stop offset="0.48" stop-color="#6C5CE7"/>
      <stop offset="1" stop-color="#FF5C42"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#08152E" flood-opacity="0.14"/>
    </filter>
    <g id="palMark">
      <path d="M17 122V77C17 48 38 27 64 27C78 27 89 33 99 44L112 59L94 77L80 61C75 55 70 51 63 51C51 51 42 61 42 78V122H17Z" fill="url(#palLeft)"/>
      <path d="M143 38V83C143 112 122 133 96 133C82 133 71 127 61 116L48 101L66 83L80 99C85 105 90 109 97 109C109 109 118 99 118 82V38H143Z" fill="url(#palRight)"/>
      <path d="M69 69L80 58L91 69L80 80L69 69Z" fill="#F7F4ED"/>
      <path d="M69 91L80 80L91 91L80 102L69 91Z" fill="#F7F4ED"/>
    </g>
    <g id="palMono">
      <path d="M17 122V77C17 48 38 27 64 27C78 27 89 33 99 44L112 59L94 77L80 61C75 55 70 51 63 51C51 51 42 61 42 78V122H17Z" fill="#08152E"/>
      <path d="M143 38V83C143 112 122 133 96 133C82 133 71 127 61 116L48 101L66 83L80 99C85 105 90 109 97 109C109 109 118 99 118 82V38H143Z" fill="#08152E"/>
      <path d="M69 69L80 58L91 69L80 80L69 69Z" fill="#FFFFFF"/>
      <path d="M69 91L80 80L91 91L80 102L69 91Z" fill="#FFFFFF"/>
    </g>
  </defs>

  <rect width="1600" height="1000" fill="#F7F4ED"/>
  <path d="M0 0H1600V12H0Z" fill="url(#palFull)"/>

  <text x="88" y="94" fill="#6C5CE7" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">DIRECTION 02</text>
  <text x="88" y="156" fill="#08152E" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="650">Palindrome</text>
  <text x="88" y="201" fill="#536174" font-family="Arial, Helvetica, sans-serif" font-size="23">A balanced identity that only Anna’s name can own.</text>

  <rect x="88" y="255" width="910" height="482" rx="38" fill="#FFFDFC" filter="url(#softShadow)"/>
  <g transform="translate(170 337) scale(1.92)">
    <use href="#palMark"/>
  </g>
  <text x="535" y="490" fill="#08152E" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="700" letter-spacing="8">anna</text>
  <text x="540" y="536" fill="#536174" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" letter-spacing="3.4">YOUR DIGITAL AI ASSISTANT</text>
  <text x="170" y="674" fill="#536174" font-family="Arial, Helvetica, sans-serif" font-size="18">The form reads the same in either direction: open, paired, complete.</text>

  <text x="1062" y="286" fill="#08152E" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2">AVATAR</text>
  <rect x="1062" y="315" width="202" height="202" rx="101" fill="#08152E"/>
  <g transform="translate(1083 336)"><use href="#palMark"/></g>

  <text x="1306" y="286" fill="#08152E" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2">MONO</text>
  <rect x="1306" y="315" width="202" height="202" rx="101" fill="#FFFFFF" stroke="#D8DDE5"/>
  <g transform="translate(1327 336)"><use href="#palMono"/></g>

  <text x="1062" y="590" fill="#08152E" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2">SMALL-SIZE TEST</text>
  <circle cx="1099" cy="659" r="37" fill="#08152E"/>
  <g transform="translate(1068 628) scale(.39)"><use href="#palMark"/></g>
  <circle cx="1189" cy="659" r="28" fill="#08152E"/>
  <g transform="translate(1165 635) scale(.3)"><use href="#palMark"/></g>
  <circle cx="1262" cy="659" r="20" fill="#08152E"/>
  <g transform="translate(1244 641) scale(.225)"><use href="#palMark"/></g>

  <rect x="88" y="792" width="1420" height="126" rx="30" fill="#08152E"/>
  <text x="130" y="836" fill="#9E9AEF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="3">IDENTITY PRINCIPLE</text>
  <text x="130" y="876" fill="#F7F4ED" font-family="Arial, Helvetica, sans-serif" font-size="26">ANNA</text>
  <path d="M245 862H385" stroke="#71809A" stroke-width="2"/>
  <path d="M375 852L385 862L375 872" fill="none" stroke="#71809A" stroke-width="2"/>
  <text x="421" y="876" fill="#F7F4ED" font-family="Arial, Helvetica, sans-serif" font-size="26">ANNA</text>
  <text x="628" y="876" fill="#9E9AEF" font-family="Arial, Helvetica, sans-serif" font-size="20">Mirrored name. Mirrored form. Distinctive from either side.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Anna identity concept 01: AN/NA Relay</title>
  <desc id="desc">A mirrored ribbon symbol derived from the broken diagonal in the Anamata wordmark, shown as a primary lockup, avatar, monochrome mark, and motion sequence.</desc>
  <defs>
    <linearGradient id="relayWarm" x1="80" y1="140" x2="145" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF5C42"/>
      <stop offset="0.52" stop-color="#8D4DFF"/>
      <stop offset="1" stop-color="#3159C7"/>
    </linearGradient>
    <linearGradient id="relayFull" x1="18" y1="82" x2="142" y2="82" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2C548C"/>
      <stop offset="0.48" stop-color="#3159C7"/>
      <stop offset="1" stop-color="#FF5C42"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#08152E" flood-opacity="0.14"/>
    </filter>
    <g id="relayMark">
      <path d="M22 124V42H46V78L80 108V138L46 108V124H22Z" fill="#2C548C"/>
      <path d="M138 36V118H114V82L80 52V22L114 52V36H138Z" fill="url(#relayWarm)"/>
      <path d="M22 27H45L63 42V65L40 47H22V27Z" fill="#4171B3"/>
      <path d="M138 133H115L97 118V95L120 113H138V133Z" fill="#FF725C"/>
    </g>
    <g id="relayMono">
      <path d="M22 124V42H46V78L80 108V138L46 108V124H22Z" fill="#08152E"/>
      <path d="M138 36V118H114V82L80 52V22L114 52V36H138Z" fill="#08152E"/>
      <path d="M22 27H45L63 42V65L40 47H22V27Z" fill="#08152E"/>
      <path d="M138 133H115L97 118V95L120 113H138V133Z" fill="#08152E"/>
    </g>
  </defs>

  <rect width="1600" height="1000" fill="#F7F4ED"/>
  <path d="M0 0H1600V12H0Z" fill="url(#relayFull)"/>

  <text x="88" y="94" fill="#3159C7" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">DIRECTION 01</text>
  <text x="88" y="156" fill="#08152E" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="650">AN/NA Relay</text>
  <text x="88" y="201" fill="#536174" font-family="Arial, Helvetica, sans-serif" font-size="23">Anamata’s broken diagonal, mirrored into Anna’s own handoff.</text>

  <rect x="88" y="255" width="910" height="482" rx="38" fill="#FFFDFC" filter="url(#softShadow)"/>
  <g transform="translate(170 337) scale(1.92)">
    <use href="#relayMark"/>
  </g>
  <text x="535" y="490" fill="#08152E" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="700" letter-spacing="10">ANNA</text>
  <text x="540" y="536" fill="#536174" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" letter-spacing="3.4">YOUR DIGITAL AI ASSISTANT</text>
  <text x="170" y="674" fill="#536174" font-family="Arial, Helvetica, sans-serif" font-size="18">Two paths meet without enclosing the mark in another badge.</text>

  <text x="1062" y="286" fill="#08152E" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2">AVATAR</text>
  <rect x="1062" y="315" width="202" height="202" rx="52" fill="#08152E"/>
  <g transform="translate(1083 336) scale(1)">
    <use href="#relayMark"/>
  </g>

  <text x="1306" y="286" fill="#08152E" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2">MONO</text>
  <rect x="1306" y="315" width="202" height="202" rx="52" fill="#FFFFFF" stroke="#D8DDE5"/>
  <g transform="translate(1327 336)">
    <use href="#relayMono"/>
  </g>

  <text x="1062" y="590" fill="#08152E" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2">SMALL-SIZE TEST</text>
  <rect x="1062" y="622" width="74" height="74" rx="19" fill="#08152E"/>
  <g transform="translate(1068 628) scale(.39)">
    <use href="#relayMark"/>
  </g>
  <rect x="1161" y="631" width="56" height="56" rx="14" fill="#08152E"/>
  <g transform="translate(1165 635) scale(.3)">
    <use href="#relayMark"/>
  </g>
  <rect x="1242" y="639" width="40" height="40" rx="10" fill="#08152E"/>
  <g transform="translate(1244 641) scale(.225)">
    <use href="#relayMark"/>
  </g>

  <rect x="88" y="792" width="1420" height="126" rx="30" fill="#08152E"/>
  <text x="130" y="836" fill="#8DA4C3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="3">MOTION PRINCIPLE</text>
  <g transform="translate(490 812) scale(.48)" opacity=".44"><use href="#relayMark"/></g>
  <path d="M602 855H688" stroke="#71809A" stroke-width="2" stroke-dasharray="7 9"/>
  <g transform="translate(710 812) scale(.48)" opacity=".72"><use href="#relayMark"/></g>
  <path d="M822 855H908" stroke="#71809A" stroke-width="2" stroke-dasharray="7 9"/>
  <g transform="translate(930 812) scale(.48)"><use href="#relayMark"/></g>
  <text x="1093" y="865" fill="#F7F4ED" font-family="Arial, Helvetica, sans-serif" font-size="21">Receive  ·  work  ·  return</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Anna Relay master candidate</title>
  <desc id="desc">The refined Relay logo with a tight violet transition and equal stem endpoints, shown in full-color and monochrome applications.</desc>
  <defs>
    <linearGradient id="page-bg" x1="0" y1="0" x2="1800" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8F3EC"/>
      <stop offset="1" stop-color="#EEE8DF"/>
    </linearGradient>
    <linearGradient id="relay-gradient" x1="42" y1="42" x2="158" y2="158" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2C548C"/>
      <stop offset="0.43" stop-color="#3159C7"/>
      <stop offset="0.49" stop-color="#6252EF"/>
      <stop offset="0.55" stop-color="#8D4DFF"/>
      <stop offset="0.61" stop-color="#E15091"/>
      <stop offset="1" stop-color="#FF5C42"/>
    </linearGradient>
    <pattern id="checker" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#FFFFFF"/>
      <rect width="12" height="12" fill="#E9E7E2"/>
      <rect x="12" y="12" width="12" height="12" fill="#E9E7E2"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#08152E" flood-opacity="0.10"/>
    </filter>
    <path id="relay-mark" d="M42 158V62H66V98L100 128V158L66 128V158H42ZM158 42V138H134V102L100 72V42L134 72V42H158ZM42 42H65L83 57V80L60 62H42V42ZM158 158H135L117 143V120L140 138H158V158Z"/>
    <style>
      .eyebrow { font: 600 18px Arial, sans-serif; letter-spacing: 4px; fill: #3159C7; }
      .heading { font: 700 56px Arial, sans-serif; letter-spacing: -2px; fill: #08152E; }
      .subheading { font: 400 24px Arial, sans-serif; fill: #526078; }
      .label { font: 700 20px Arial, sans-serif; fill: #08152E; }
      .caption { font: 400 17px Arial, sans-serif; fill: #667085; }
      .dark-label { font: 700 20px Arial, sans-serif; fill: #FFFFFF; }
      .dark-caption { font: 400 17px Arial, sans-serif; fill: #ADB7C8; }
    </style>
  </defs>

  <rect width="1800" height="1000" fill="url(#page-bg)"/>
  <text x="92" y="86" class="eyebrow">MASTER CANDIDATE 04</text>
  <text x="92" y="152" class="heading">Anna Relay</text>
  <text x="92" y="196" class="subheading">Tight violet transition. Equal stem endpoints. One consistent silhouette.</text>

  <g filter="url(#shadow)">
    <rect x="80" y="248" width="420" height="600" rx="36" fill="#FFFFFF"/>
    <rect x="520" y="248" width="420" height="600" rx="36" fill="#000000"/>
    <rect x="960" y="248" width="420" height="600" rx="36" fill="#08152E"/>
    <rect x="1400" y="248" width="320" height="290" rx="36" fill="#FFFFFF"/>
    <rect x="1400" y="558" width="320" height="290" rx="36" fill="#000000"/>
  </g>

  <rect x="112" y="282" width="356" height="392" rx="24" fill="url(#checker)"/>
  <g transform="translate(158 315) scale(1.32)" fill="url(#relay-gradient)"><use href="#relay-mark"/></g>
  <text x="112" y="734" class="label">Full color</text>
  <text x="112" y="766" class="caption">Transparent background</text>
  <text x="112" y="802" class="caption">Navy · blue · tight violet · coral</text>

  <g transform="translate(598 315) scale(1.32)" fill="url(#relay-gradient)"><use href="#relay-mark"/></g>
  <text x="552" y="734" class="dark-label">Full color</text>
  <text x="552" y="766" class="dark-caption">Black background</text>
  <text x="552" y="802" class="dark-caption">Maximum contrast application</text>

  <g transform="translate(1038 315) scale(1.32)" fill="url(#relay-gradient)"><use href="#relay-mark"/></g>
  <text x="992" y="734" class="dark-label">Full color</text>
  <text x="992" y="766" class="dark-caption">Anna navy background</text>
  <text x="992" y="802" class="dark-caption">Primary product application</text>

  <g transform="translate(1460 276) scale(.98)" fill="#08152E"><use href="#relay-mark"/></g>
  <text x="1432" y="480" class="label">Mono dark</text>
  <text x="1432" y="508" class="caption">Navy on light</text>

  <g transform="translate(1460 586) scale(.98)" fill="#FFFFFF"><use href="#relay-mark"/></g>
  <text x="1432" y="790" class="dark-label">Mono light</text>
  <text x="1432" y="818" class="dark-caption">White on dark</text>

  <line x1="80" y1="910" x2="1720" y2="910" stroke="#D5CFC5"/>
  <g transform="translate(82 923)">
    <circle cx="8" cy="8" r="8" fill="#3159C7"/>
    <text x="32" y="15" class="caption">All upper stems terminate at y=42</text>
    <circle cx="346" cy="8" r="8" fill="#FF5C42"/>
    <text x="370" y="15" class="caption">All lower stems terminate at y=158</text>
    <rect x="746" width="110" height="16" rx="8" fill="url(#relay-gradient)"/>
    <text x="878" y="15" class="caption">Violet is concentrated around the handoff point</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="820" viewBox="0 0 1800 820" role="img" aria-labelledby="title desc">
  <title id="title">Anna Relay height and color isolation test</title>
  <desc id="desc">Four near-identical Relay marks isolate the effects of equal outer heights and a narrower violet transition.</desc>
  <defs>
    <linearGradient id="wide" x1="22" y1="22" x2="178" y2="178" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2C548C"/><stop offset="0.38" stop-color="#3159C7"/><stop offset="0.67" stop-color="#8D4DFF"/><stop offset="1" stop-color="#FF5C42"/>
    </linearGradient>
    <linearGradient id="tight" x1="22" y1="22" x2="178" y2="178" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2C548C"/><stop offset="0.43" stop-color="#3159C7"/><stop offset="0.49" stop-color="#6252EF"/><stop offset="0.55" stop-color="#8D4DFF"/><stop offset="0.61" stop-color="#E15091"/><stop offset="1" stop-color="#FF5C42"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1800" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2C548C"/><stop offset="0.53" stop-color="#8D4DFF"/><stop offset="1" stop-color="#FF5C42"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#08152E" flood-opacity="0.12"/></filter>
    <g id="offset">
      <path d="M42 144V62H66V98L100 128V158L66 128V144H42Z"/>
      <path d="M158 56V138H134V102L100 72V42L134 72V56H158Z"/>
      <path d="M42 47H65L83 62V85L60 67H42V47Z"/>
      <path d="M158 153H135L117 138V115L140 133H158V153Z"/>
    </g>
    <g id="equal">
      <path d="M42 144V62H66V98L100 128V158L66 128V144H42Z"/>
      <path d="M158 56V138H134V102L100 72V42L134 72V56H158Z"/>
      <path d="M42 42H65L83 57V80L60 62H42V42Z"/>
      <path d="M158 158H135L117 143V120L140 138H158V158Z"/>
    </g>
  </defs>
  <rect width="1800" height="820" fill="#F7F4ED"/>
  <rect width="1800" height="12" fill="url(#bar)"/>
  <text x="70" y="82" fill="#3159C7" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">CONTROLLED TEST</text>
  <text x="70" y="140" fill="#08152E" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700">Height and colour, isolated</text>
  <text x="70" y="181" fill="#536174" font-family="Arial, Helvetica, sans-serif" font-size="21">Only the named variable changes from one card to the next.</text>

  <g transform="translate(70 226)">
    <rect width="390" height="510" rx="32" fill="#FFFDFC" filter="url(#shadow)"/>
    <rect x="75" y="36" width="240" height="240" rx="58" fill="#08152E"/>
    <g transform="translate(95 56)" fill="url(#wide)"><use href="#offset"/></g>
    <text x="34" y="333" fill="#3159C7" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2">CONTROL</text>
    <text x="34" y="376" fill="#08152E" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Offset + broad colour</text>
    <text x="34" y="412" fill="#536174" font-family="Arial, Helvetica, sans-serif" font-size="17">Current restrained Relay.</text>
    <text x="34" y="468" fill="#8793A5" font-family="Arial, Helvetica, sans-serif" font-size="15">5 px rotational height offset</text>
  </g>
  <g transform="translate(493 226)">
    <rect width="390" height="510" rx="32" fill="#FFFDFC" filter="url(#shadow)"/>
    <rect x="75" y="36" width="240" height="240" rx="58" fill="#08152E"/>
    <g transform="translate(95 56)" fill="url(#wide)"><use href="#equal"/></g>
    <text x="34" y="333" fill="#5063DA" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2">HEIGHT ONLY</text>
    <text x="34" y="376" fill="#08152E" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Equal + broad colour</text>
    <text x="34" y="412" fill="#536174" font-family="Arial, Helvetica, sans-serif" font-size="17">Outer top and bottom align.</text>
    <text x="34" y="468" fill="#8793A5" font-family="Arial, Helvetica, sans-serif" font-size="15">Original internal spacing retained</text>
  </g>
  <g transform="translate(916 226)">
    <rect width="390" height="510" rx="32" fill="#FFFDFC" filter="url(#shadow)"/>
    <rect x="75" y="36" width="240" height="240" rx="58" fill="#08152E"/>
    <g transform="translate(95 56)" fill="url(#tight)"><use href="#offset"/></g>
    <text x="34" y="333" fill="#8D4DFF" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2">COLOUR ONLY</text>
    <text x="34" y="376" fill="#08152E" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Offset + tight violet</text>
    <text x="34" y="412" fill="#536174" font-family="Arial, Helvetica, sans-serif" font-size="17">Violet occupies the exchange.</text>
    <text x="34" y="468" fill="#8793A5" font-family="Arial, Helvetica, sans-serif" font-size="15">Original geometry retained</text>
  </g>
  <g transform="translate(1339 226)">
    <rect width="390" height="510" rx="32" fill="#FFFDFC" filter="url(#shadow)"/>
    <rect x="75" y="36" width="240" height="240" rx="58" fill="#08152E"/>
    <g transform="translate(95 56)" fill="url(#tight)"><use href="#equal"/></g>
    <text x="34" y="333" fill="#FF5C42" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2">BOTH</text>
    <text x="34" y="376" fill="#08152E" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Equal + tight violet</text>
    <text x="34" y="412" fill="#536174" font-family="Arial, Helvetica, sans-serif" font-size="17">Two restrained refinements together.</text>
    <text x="34" y="468" fill="#8793A5" font-family="Arial, Helvetica, sans-serif" font-size="15">No other geometry changed</text>
  </g>
</svg>

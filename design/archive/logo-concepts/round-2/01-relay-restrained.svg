<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Anna Relay, restrained original</title>
  <desc id="desc">The original four-piece Relay with one coherent blue to violet to coral color journey.</desc>
  <defs>
    <linearGradient id="flow" x1="18" y1="24" x2="142" y2="136" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2C548C"/>
      <stop offset="0.38" stop-color="#3159C7"/>
      <stop offset="0.67" stop-color="#8D4DFF"/>
      <stop offset="1" stop-color="#FF5C42"/>
    </linearGradient>
    <linearGradient id="flowWide" x1="0" y1="0" x2="1600" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2C548C"/>
      <stop offset="0.55" stop-color="#8D4DFF"/>
      <stop offset="1" stop-color="#FF5C42"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#08152E" flood-opacity="0.14"/>
    </filter>
    <g id="mark">
      <path d="M22 124V42H46V78L80 108V138L46 108V124H22Z" fill="url(#flow)"/>
      <path d="M138 36V118H114V82L80 52V22L114 52V36H138Z" fill="url(#flow)"/>
      <path d="M22 27H45L63 42V65L40 47H22V27Z" fill="url(#flow)"/>
      <path d="M138 133H115L97 118V95L120 113H138V133Z" fill="url(#flow)"/>
    </g>
    <g id="mono">
      <path d="M22 124V42H46V78L80 108V138L46 108V124H22Z"/>
      <path d="M138 36V118H114V82L80 52V22L114 52V36H138Z"/>
      <path d="M22 27H45L63 42V65L40 47H22V27Z"/>
      <path d="M138 133H115L97 118V95L120 113H138V133Z"/>
    </g>
  </defs>
  <rect width="1600" height="1000" fill="#F7F4ED"/>
  <rect width="1600" height="12" fill="url(#flowWide)"/>
  <text x="88" y="94" fill="#3159C7" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">ROUND 02 · CONTROL</text>
  <text x="88" y="156" fill="#08152E" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700">Relay, restrained</text>
  <text x="88" y="201" fill="#536174" font-family="Arial, Helvetica, sans-serif" font-size="23">The same choreography, with colour behaving as one journey.</text>

  <rect x="88" y="255" width="910" height="482" rx="38" fill="#FFFDFC" filter="url(#shadow)"/>
  <g transform="translate(170 337) scale(1.92)"><use href="#mark"/></g>
  <text x="535" y="490" fill="#08152E" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="700" letter-spacing="10">ANNA</text>
  <text x="540" y="536" fill="#536174" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" letter-spacing="3.4">YOUR DIGITAL AI ASSISTANT</text>
  <text x="170" y="674" fill="#536174" font-family="Arial, Helvetica, sans-serif" font-size="18">Blue enters. Violet marks the exchange. Coral returns.</text>

  <text x="1062" y="286" fill="#08152E" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2">AVATAR</text>
  <rect x="1062" y="315" width="202" height="202" rx="52" fill="#08152E"/>
  <g transform="translate(1083 336)"><use href="#mark"/></g>
  <text x="1306" y="286" fill="#08152E" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2">MONO</text>
  <rect x="1306" y="315" width="202" height="202" rx="52" fill="#FFFFFF" stroke="#D8DDE5"/>
  <g transform="translate(1327 336)" fill="#08152E"><use href="#mono"/></g>

  <text x="1062" y="590" fill="#08152E" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2">COLOUR LOGIC</text>
  <circle cx="1080" cy="643" r="14" fill="#2C548C"/><text x="1105" y="650" fill="#536174" font-family="Arial, Helvetica, sans-serif" font-size="17">Receive</text>
  <circle cx="1215" cy="643" r="14" fill="#8D4DFF"/><text x="1240" y="650" fill="#536174" font-family="Arial, Helvetica, sans-serif" font-size="17">Work</text>
  <circle cx="1338" cy="643" r="14" fill="#FF5C42"/><text x="1363" y="650" fill="#536174" font-family="Arial, Helvetica, sans-serif" font-size="17">Return</text>

  <rect x="88" y="792" width="1420" height="126" rx="30" fill="#08152E"/>
  <text x="130" y="836" fill="#8DA4C3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="3">WHAT CHANGED</text>
  <text x="130" y="878" fill="#F7F4ED" font-family="Arial, Helvetica, sans-serif" font-size="22">One spatial gradient replaces four independently coloured pieces.</text>
  <text x="930" y="878" fill="#A9B6C9" font-family="Arial, Helvetica, sans-serif" font-size="19">Geometry remains unchanged for a fair comparison.</text>
</svg>

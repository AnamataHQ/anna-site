<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Anna Space Relay</title>
  <desc id="desc">Two N-derived paths create an open central corridor, using the same blue to violet to coral color journey.</desc>
  <defs>
    <linearGradient id="flow" x1="18" y1="25" x2="142" y2="135" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2C548C"/>
      <stop offset="0.4" stop-color="#3159C7"/>
      <stop offset="0.68" stop-color="#8D4DFF"/>
      <stop offset="1" stop-color="#FF5C42"/>
    </linearGradient>
    <linearGradient id="flowWide" x1="0" y1="0" x2="1600" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2C548C"/><stop offset="0.55" stop-color="#8D4DFF"/><stop offset="1" stop-color="#FF5C42"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#08152E" flood-opacity="0.14"/>
    </filter>
    <g id="mark">
      <path d="M18 132V28H43L73 54V86L46 63V132H18Z" fill="url(#flow)"/>
      <path d="M142 28V132H117L87 106V74L114 97V28H142Z" fill="url(#flow)"/>
      <path d="M74 46L86 56V114L74 104V46Z" fill="#F7F4ED" opacity="0.92"/>
    </g>
    <g id="mono">
      <path d="M18 132V28H43L73 54V86L46 63V132H18Z"/>
      <path d="M142 28V132H117L87 106V74L114 97V28H142Z"/>
      <path d="M74 46L86 56V114L74 104V46Z" fill="#FFFFFF"/>
    </g>
  </defs>
  <rect width="1600" height="1000" fill="#F7F4ED"/>
  <rect width="1600" height="12" fill="url(#flowWide)"/>
  <text x="88" y="94" fill="#8D4DFF" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">ROUND 02 · C</text>
  <text x="88" y="156" fill="#08152E" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700">Space Relay</text>
  <text x="88" y="201" fill="#536174" font-family="Arial, Helvetica, sans-serif" font-size="23">The handoff is visible as the room Anna creates.</text>

  <rect x="88" y="255" width="910" height="482" rx="38" fill="#FFFDFC" filter="url(#shadow)"/>
  <g transform="translate(170 337) scale(1.92)"><use href="#mark"/></g>
  <text x="535" y="490" fill="#08152E" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="700" letter-spacing="10">ANNA</text>
  <text x="540" y="536" fill="#536174" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" letter-spacing="3.4">YOUR DIGITAL AI ASSISTANT</text>
  <text x="170" y="674" fill="#536174" font-family="Arial, Helvetica, sans-serif" font-size="18">The two paths define a clean corridor instead of another object.</text>

  <text x="1062" y="286" fill="#08152E" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2">AVATAR</text>
  <rect x="1062" y="315" width="202" height="202" rx="52" fill="#08152E"/>
  <g transform="translate(1083 336)"><use href="#mark"/></g>
  <text x="1306" y="286" fill="#08152E" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2">MONO</text>
  <rect x="1306" y="315" width="202" height="202" rx="52" fill="#FFFFFF" stroke="#D8DDE5"/>
  <g transform="translate(1327 336)" fill="#08152E"><use href="#mono"/></g>

  <text x="1062" y="590" fill="#08152E" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2">SMALL-SIZE TEST</text>
  <rect x="1062" y="622" width="74" height="74" rx="19" fill="#08152E"/><g transform="translate(1068 628) scale(.39)"><use href="#mark"/></g>
  <rect x="1161" y="631" width="56" height="56" rx="14" fill="#08152E"/><g transform="translate(1165 635) scale(.3)"><use href="#mark"/></g>
  <rect x="1242" y="639" width="40" height="40" rx="10" fill="#08152E"/><g transform="translate(1244 641) scale(.225)"><use href="#mark"/></g>

  <rect x="88" y="792" width="1420" height="126" rx="30" fill="#08152E"/>
  <text x="130" y="836" fill="#A79CF4" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="3">NEGATIVE-SPACE PRINCIPLE</text>
  <text x="130" y="878" fill="#F7F4ED" font-family="Arial, Helvetica, sans-serif" font-size="22">Anna’s value is not another shape. It is the clear lane left between the work.</text>
</svg>
